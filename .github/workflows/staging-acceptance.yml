name: Accept Odyssey staging email journey
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odyssey-Check and release Odyssey-refs/heads/main
  cancel-in-progress: false
jobs:
  accept:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Raw tail output stays on the runner; only route labels and timings are printed.
      - name: Trace staging Worker CPU
        run: |
          for script in odyssey-landing-staging odyssey-landing-staging-scheduler; do
            nohup pnpm exec wrangler tail "$script" --format json > "$RUNNER_TEMP/$script.tail" 2>/dev/null &
          done
          sleep 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Exercise one controlled email-only subscription on deployed staging
        run: node scripts/accept-staging-waitlist.mjs
        env:
          LAUNCH_ACCEPTANCE: staging-owner-inboxes
          LAUNCH_TEST_EMAIL: ${{ vars.LAUNCH_TEST_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WAITLIST_TOKEN_SECRET: ${{ secrets.WAITLIST_TOKEN_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      - name: Summarise Worker CPU by route
        if: always()
        run: |
          sleep 30
          pkill -f "wrangler tail" || true
          node scripts/summarize-tail-cpu.mjs "$RUNNER_TEMP"/*.tail
